name: Deploy development

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ag-go-web-dev-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST_DEV }}
      VPS_USER: ${{ secrets.VPS_USER_DEV }}
      VPS_PORT: ${{ secrets.VPS_PORT_DEV || '22' }}
      APP_PATH: ${{ secrets.VPS_APP_PATH_DEV || '/www/wwwroot/dev/ag-go-v2/ag-go-web' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY_DEV }}

      - name: Deploy via SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            sudo git config --global --add safe.directory '$APP_PATH'
            cd '$APP_PATH'
            sudo git pull --ff-only origin dev
            TAG=\$(git rev-parse --short HEAD)
            sudo env TAG=\$TAG docker compose up --build -d --remove-orphans
          "
